      if (a[i] === b[j]) { ops.push(['=', a[i]]); i += 1; j += 1 }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push(['-', a[i]]); i += 1 }
      else { ops.push(['+', b[j]]); j += 1 }
    }
    while (i < n) ops.push(['-', a[i++]])
    while (j < m) ops.push(['+', b[j++]])
    return ops
  }
  function mergeSegs(segs) {
    // 夹在两段改动之间、只有 1 个字的“相同”片段并进改动，读起来不那么碎
    const out = []
    segs.forEach((s, k) => {
      const prev = out[out.length - 1]
      const tiny = !s.ch && Array.from(s.s).length <= 2 && k > 0 && k < segs.length - 1 && segs[k - 1].ch && segs[k + 1].ch
      const seg = tiny ? { s: s.s, ch: true } : s
      if (prev && prev.ch === seg.ch) prev.s += seg.s; else out.push({ s: seg.s, ch: seg.ch })
    })
    return out
  }
  function inlineDiff(a, b) {
    const A = Array.from(a), B = Array.from(b)
    if (A.length * B.length > 160000) return null
    const ops = lcsOps(A, B)
    const common = ops.filter((o) => o[0] === '=').length
    if (common < Math.max(4, 0.5 * Math.max(A.length, B.length))) return null
    const del = [], add = []
    const push = (arr, s, ch) => { const last = arr[arr.length - 1]; if (last && last.ch === ch) last.s += s; else arr.push({ s, ch }) }
    for (const [op, x] of ops) { if (op === '=') { push(del, x, false); push(add, x, false) } else if (op === '-') push(del, x, true); else push(add, x, true) }
    const d = mergeSegs(del), a2 = mergeSegs(add)
    const pieces = (arr) => arr.filter((x) => x.ch).length
    if (pieces(d) > 4 || pieces(a2) > 4) return null
    return { del: d, add: a2 }
  }
  function diffRows(oldText, newText) {
    const A = String(oldText).replace(/\r\n?/g, '\n').split('\n'), B = String(newText).replace(/\r\n?/g, '\n').split('\n')
    const ops = lcsOps(A, B)
    const rows = []
    let k = 0
    while (k < ops.length) {
      if (ops[k][0] === '=') { rows.push({ t: '=', segs: [{ s: ops[k][1] }] }); k += 1; continue }
      const dels = [], adds = []
      while (k < ops.length && ops[k][0] !== '=') { (ops[k][0] === '-' ? dels : adds).push(ops[k][1]); k += 1 }
      const delRows = dels.map((s) => ({ t: '-', segs: [{ s }] }))
      const addRows = adds.map((s) => ({ t: '+', segs: [{ s }] }))
      for (let p = 0; p < Math.min(dels.length, adds.length); p += 1) {
        const r = inlineDiff(dels[p], adds[p])
        if (r) { delRows[p] = { t: '-', segs: r.del, inline: true }; addRows[p] = { t: '+', segs: r.add, inline: true } }
      }
      rows.push(...delRows, ...addRows)
    }
    // 长段未改动的行折叠成一行“n 行没变”
    const out = []
    let run = []
    const flushRun = (edge) => {
      if (run.length > 3) {
        const keepHead = edge === 'start' ? 0 : 1, keepTail = edge === 'end' ? 0 : 1
        out.push(...run.slice(0, keepHead))
        out.push({ t: 'gap', n: run.length - keepHead - keepTail })
        out.push(...run.slice(run.length - keepTail))
      } else out.push(...run)
      run = []
    }
    rows.forEach((r) => { if (r.t === '=') run.push(r); else { flushRun(out.length ? 'mid' : 'start'); out.push(r) } })
    flushRun('end')
    return out
  }

  /* =====================================================================
   * 4. 迷你 h()/patch 运行时：组件函数输入 state 输出 vnode，接口与 React.createElement 同形，
   *    移植时把 h 换成 React.createElement、onMount/onUpdate 换成 useEffect 即可。
   * ===================================================================== */
  const SVG_NS = 'http://www.w3.org/2000/svg'
  const EMPTY = {}
  function h(type, props, ...children) {
    const p = props || {}
    const kids = []
    flatten(children, kids)
    if (typeof type === 'function') { const v = type(Object.assign({}, p, { children: kids })); if (v && p.key != null) v.key = p.key; return v }
    return { type, props: p, children: kids, key: p.key }
  }
  function flatten(arr, out) {
    for (const c of arr) {
      if (c == null || c === false || c === true) continue
      if (Array.isArray(c)) flatten(c, out)
      else if (typeof c === 'object') out.push(c)
      else out.push({ type: '#text', text: String(c), props: EMPTY, children: [] })
    }
  }
  const afterQueue = []
  function mount(v, isSvg) {
    if (v.type === '#text') { v.el = document.createTextNode(v.text); return v.el }
    const svg = isSvg || v.type === 'svg'
    const el = svg ? document.createElementNS(SVG_NS, v.type) : document.createElement(v.type)
    v.el = el
    applyProps(el, EMPTY, v.props, svg)
    if (v.props.html == null) for (const c of v.children) el.appendChild(mount(c, svg))
    if (v.props.ref) v.props.ref(el)
    if (v.props.onMount) afterQueue.push(() => v.props.onMount(el))
    return el
  }
  function patch(o, n, isSvg) {
    const el = (n.el = o.el)
    if (n.type === '#text') { if (o.text !== n.text) el.nodeValue = n.text; return }
    const svg = isSvg || n.type === 'svg'
    applyProps(el, o.props, n.props, svg)
    if (n.props.html == null) patchChildren(el, o.children, n.children, svg)
    if (n.props.onUpdate) afterQueue.push(() => n.props.onUpdate(el))
  }
  function patchChildren(parent, oldCh, newCh, svg) {
    const keyed = new Map(); const unkeyed = []
    for (const c of oldCh) { if (c.key != null) keyed.set(c.type + '|' + c.key, c); else unkeyed.push(c) }
    const used = new Set()
    let cursor = 0
    for (const nc of newCh) {
      let match = null
      if (nc.key != null) { const k = nc.type + '|' + nc.key; match = keyed.get(k) || null; if (match) keyed.delete(k) }
      else {
        for (let i = cursor; i < unkeyed.length; i += 1) { const oc = unkeyed[i]; if (!used.has(oc) && oc.type === nc.type) { match = oc; used.add(oc); cursor = i + 1; break } }
      }
      if (match) patch(match, nc, svg); else mount(nc, svg)
    }
    for (const c of keyed.values()) unmount(c)
    for (const c of unkeyed) if (!used.has(c)) unmount(c)
    let ref = parent.firstChild
    for (const nc of newCh) { if (nc.el !== ref) parent.insertBefore(nc.el, ref); else ref = ref.nextSibling }
  }
  function unmount(v) { if (v.el && v.el.parentNode) v.el.parentNode.removeChild(v.el) }
  function applyProps(el, oldP, newP, svg) {
    for (const k in oldP) if (!(k in newP)) setProp(el, k, undefined, svg)
    for (const k in newP) if (k !== 'value' && oldP[k] !== newP[k]) setProp(el, k, newP[k], svg)
    if ('value' in newP) { const v = newP.value == null ? '' : String(newP.value); if (el.value !== v) el.value = v }
  }
  function evProxy(e) { const fn = this.__wsmH && this.__wsmH[e.type]; if (fn) fn(e) }
  function setProp(el, k, val, svg) {
    if (k === 'key' || k === 'ref' || k === 'onMount' || k === 'onUpdate' || k === 'children' || k === 'value') return
    if (k[0] === 'o' && k[1] === 'n') {
      const name = k.slice(2).toLowerCase()
      el.__wsmH = el.__wsmH || {}
      if (!(name in el.__wsmH)) el.addEventListener(name, evProxy)
      el.__wsmH[name] = val || null
      return
    }
    if (k === 'className') { if (svg) el.setAttribute('class', val || ''); else el.className = val || ''; return }
    if (k === 'style') { el.style.cssText = val || ''; return }
    if (k === 'html') { el.innerHTML = val == null ? '' : val; return }
    const name = k === 'tabIndex' ? 'tabindex' : k === 'htmlFor' ? 'for' : k
    if (val == null || val === false) el.removeAttribute(name)
    else el.setAttribute(name, val === true ? '' : val)
  }

  let rootV = null, rootEl = null, scheduled = false
  const up = () => { if (!scheduled) { scheduled = true; queueMicrotask(render) } }
  function render() {
    scheduled = false
    normalize()
    const v = App(S)
    if (!rootV) rootEl.appendChild(mount(v)); else patch(rootV, v)
    rootV = v
    const q = afterQueue.splice(0)
    for (const f of q) { try { f() } catch (err) { console.error(err) } }
    const fq = focusQueue.splice(0)
    for (const f of fq) { try { f() } catch (err) { console.error(err) } }
  }
  const focusQueue = []
  function focusLater(target) {
    focusQueue.push(() => {
      const el = typeof target === 'string' ? document.querySelector(target) : typeof target === 'function' ? target() : target
      if (el && el.isConnected) el.focus({ preventScroll: false })
    })
    up()
  }

  /* =====================================================================
   * 5. 状态（集中在一个 store）
   * ===================================================================== */
  const S = {
    pv: { theme: 'light', width: 640, data: 'normal', sim: 'ok' },
    status: 'ready', D: null,
    size: 'compact', pw: 640,
    view: 'overview', focus: false, refreshing: false,
    ov: { flowOpen: false },
    pd: { busy: {}, leaving: {}, errors: {}, mode: {}, current: -1 },
    ins: { tab: 'global', editing: null, draft: null, baseline: null, error: '', saving: false, current: 0, preambleOpen: false, expanded: {}, editor: '', flash: null },
    mm: { query: '', scope: 'all', type: 'all', sel: null, view: 'list', bodyView: 'edit', draft: null, baseline: null, errors: {}, saving: false, saveError: '', tagInput: null, tagError: '' },
    menu: null, modal: null, toasts: [],
  }
  const scrollMem = {}

  function buildData(kind) {
    const list = RAW.list
    const empty = kind === 'empty'
    const D = {
      workspace: clone(PREVIEW_EXTRA.workspace),
      root: list.root, globalRoot: list.globalRoot, agentWrites: list.agentWrites,
      limits: clone(RAW.limits),
      editors: clone(RAW.agents.editors),
      memories: empty ? [] : clone(list.memories).concat(clone(PREVIEW_EXTRA.staleMemories)),
      pending: empty ? [] : clone(list.pending),
      agents: empty
        ? { exists: false, path: RAW.agents.agents.path, preamble: '', sections: [], mtime: null }
        : { exists: true, path: RAW.agentsSections.path, preamble: RAW.agentsSections.preamble, mtime: PREVIEW_EXTRA.agentsMtime, sections: RAW.agentsSections.sections.map((s) => ({ uid: nextUid(), name: stripNum(s.title), body: s.body })) },
      project: empty
        ? { team: { exists: false, path: PREVIEW_EXTRA.project.team.path }, local: { exists: false, path: PREVIEW_EXTRA.project.local.path } }
        : clone(PREVIEW_EXTRA.project),
    }
    return D
  }
  function loadData(kind) {
    S.pv.data = kind
    S.menu = null; S.modal = null
    S.pd = { busy: {}, leaving: {}, errors: {}, mode: {}, current: -1 }
    Object.assign(S.ins, { editing: null, draft: null, baseline: null, error: '', saving: false, current: 0 })
    Object.assign(S.mm, { sel: null, view: 'list', draft: null, baseline: null, errors: {}, saving: false, saveError: '', tagInput: null })
    if (kind === 'loading') { S.status = 'loading'; S.D = null }
    else if (kind === 'error') { S.status = 'error'; S.D = null }
    else { S.status = 'ready'; S.D = buildData(kind) }
  }

  /* ---- 派生数据 ---- */
  const stripNum = (title) => String(title).replace(/^\d+\.\s*/, '')
  const TYPES = ['user', 'feedback', 'project', 'reference', 'pitfall']
  const TYPE_ICON = { user: 'user', feedback: 'bubble', project: 'flag', reference: 'bookmark', pitfall: 'cone' }
  const memKey = (m) => m.scope + ':' + m.id
  const libName = (scope) => (scope === 'global' ? t('layer.globalMem') : t('layer.projMem'))
  const cellOfScope = (scope) => (scope === 'global' ? 'globalMem' : 'projMem')
  const findMem = (key) => (S.D ? S.D.memories.find((m) => memKey(m) === key) : null)
  const byModified = (a, b) => (Date.parse(b.modified || 0) || 0) - (Date.parse(a.modified || 0) || 0)
  function chapterBytes(n, name, body) { return bytesOf((`## ${n}. ${name}\n\n${body}`).trimEnd() + '\n') }
  function agentsBytesOf(ag) {
    if (!ag || !ag.exists) return 0
    let b = ag.preamble ? bytesOf(ag.preamble + '\n\n') : 0
    ag.sections.forEach((s, i) => { b += chapterBytes(i + 1, s.name, s.body) })
    return b + Math.max(0, ag.sections.length - 1)
  }
  function indexLine(m) { const link = m.id.replace(/[-_]+/g, ' '); return m.description ? `- [${link}](${m.id}.md) — ${m.description}` : `- [${link}](${m.id}.md)` }
  function indexBytes(scope) { const items = S.D.memories.filter((m) => m.scope === scope); return items.length ? bytesOf('# Memory Index\n\n' + items.map(indexLine).join('\n') + '\n') : 0 }
  function sourceKind(m) {
    if (m.source === 'user' && m.evidenceVerified === true) return 'verified'
    if (m.source === 'user' && m.evidenceVerified === false) return 'mismatch'
    if (m.source === 'user') return 'legacy'
    if (m.source === 'agent') return 'agent'
    if (m.source == null && Number.isFinite(m.confidence)) return 'confidence'
    return 'none'
  }
  function staleInfo(m) {
    if (m.lastHit) { const d = daysSince(m.lastHit); return d > 60 ? { kind: 'unused', days: d } : null }
    if (!m.hits) { const d = daysSince(m.created || m.modified); return d > 30 ? { kind: 'never', days: d } : null }
    return null
  }
  function historyDir(scope) {
    const root = scope === 'global' ? S.D.globalRoot : S.D.root
    return homeShort(root.replace(/\\memory$/, '\\.memory-state\\history\\'))
  }
  function findSectionByTitle(title) { const hit = S.D.agents.sections.filter((s) => s.name === title); return hit.length === 1 ? hit[0] : null }

  // 草稿去向（规则见 inventory §3.2）
  function destOf(d) {
    if (d.load === 'always') {
      if (d.scope === 'project') return { cell: 'projInstr', kind: 'blocked' }
      if (!d.newChapter && (d.chapterTitle || d.chapter)) {
        const sec = d.chapterTitle ? findSectionByTitle(d.chapterTitle) : null
        const idx = sec ? S.D.agents.sections.indexOf(sec) : -1
        const old = d.supersedes ? S.D.memories.find((m) => m.id === d.supersedes && m.scope === (d.supersedesScope || 'project')) : null
        return { cell: 'globalInstr', kind: 'overwrite', chapter: d.chapter, chapterTitle: d.chapterTitle, section: sec, sectionNum: idx + 1, alsoRemove: old }
      }
      return { cell: 'globalInstr', kind: 'append', next: S.D.agents.sections.length + 1 }
    }
    const cell = cellOfScope(d.scope)
    if (d.supersedes) {
      const old = S.D.memories.find((m) => m.id === d.supersedes && m.scope === d.scope) || S.D.memories.find((m) => m.id === d.supersedes)
      return { cell, kind: 'replace', old }
    }
    return { cell, kind: 'add' }
  }
  function whyOf(d) {
    const r = []
    if (d.load === 'always') r.push(['global', ''])
    if (d.source === 'agent') r.push(['agent', ''])
    else if (d.source === 'user' && d.evidenceVerified === false) r.push(['unverified', 'warn'])
    if (!r.length) r.push(['review', ''])
    return r
  }
  const cellName = (cell) => t('layer.' + cell)

  /* ---- 草稿编辑（记忆详情） ---- */
  const toDraft = (m) => ({ title: m.title, description: m.description || '', type: TYPES.includes(m.type) ? m.type : 'project', scope: m.scope, tags: (m.tags || []).slice(), body: m.body || '', slug: m.id })
  const sameDraft = (a, b) => !!a && !!b && a.title === b.title && a.description === b.description && a.type === b.type && a.scope === b.scope && a.body === b.body && a.slug === b.slug && a.tags.join('\u0000') === b.tags.join('\u0000')
  const memDirty = () => !!(S.mm.draft && S.mm.baseline && !sameDraft(S.mm.draft, S.mm.baseline))
  const chapDirty = () => !!(S.ins.editing != null && S.ins.draft && (S.ins.draft.title !== S.ins.baseline.title || S.ins.draft.body !== S.ins.baseline.body))
  function validateDraft(d) {
    const L = S.D.limits, e = {}
    if (!d.title.trim()) e.title = t('err.title.empty')
    else if (Array.from(d.title).length > L.maxTitleChars) e.title = t('err.title.long', { n: L.maxTitleChars })
    if (Array.from(d.description).length > L.maxDescriptionChars) e.description = t('err.desc.long', { n: L.maxDescriptionChars })
    if (!d.body.trim()) e.body = t('err.body.empty')
    else if (Array.from(d.body).length > L.maxBodyChars) e.body = t('err.body.long', { n: L.maxBodyChars })
    if (!/^[a-z0-9][a-z0-9-]*$/.test(d.slug) || d.slug.length < 2) e.slug = t('err.slug')
    return e
  }
  function validateTag(raw, tags) {
    const L = S.D.limits, v = raw.trim()
    if (!v) return t('err.tag.empty')
    if (/[,\]\n]/.test(v)) return t('err.tag.chars')
    if (Array.from(v).length > L.maxTagChars) return t('err.tag.long', { n: L.maxTagChars })
    if (tags.includes(v)) return t('err.tag.dup')
    if (tags.length >= L.maxTags) return t('err.tag.many', { n: L.maxTags })
    return ''
  }

  function visibleMems(over) {
    const o = over || {}
    const q = String(o.query != null ? o.query : S.mm.query).trim().toLowerCase()
    const scope = o.scope || S.mm.scope, type = o.type || S.mm.type
    return S.D.memories.slice().sort(byModified).filter((m) => (scope === 'all' || m.scope === scope) && (type === 'all' || m.type === type) &&
      (!q || [m.title, m.description, m.id, m.body].concat(m.tags || []).some((x) => String(x || '').toLowerCase().includes(q))))
  }
  function setSelection(m) {
    S.mm.sel = m ? memKey(m) : null
    S.mm.draft = m ? toDraft(m) : null
    S.mm.baseline = m ? toDraft(m) : null
    S.mm.errors = {}; S.mm.saveError = ''; S.mm.tagInput = null; S.mm.tagError = ''
  }
  // 渲染前的规整：选中项消失、分栏时自动选第一条（F16）
  function normalize() {
    if (!S.D) return
    const M = S.mm
    if (M.sel && !findMem(M.sel)) { setSelection(null); M.view = 'list' }
    if (S.view === 'memories' && S.size !== 'narrow' && !memDirty()) {
      const vis = visibleMems()
      if (!M.sel || !vis.some((m) => memKey(m) === M.sel)) setSelection(vis[0] || null)
    }
    if (S.size === 'narrow' && M.view === 'detail' && !M.sel) M.view = 'list'
    if (S.ins.editing != null && S.ins.editing !== 'new' && !S.D.agents.sections.some((s) => s.uid === S.ins.editing)) { S.ins.editing = null; S.ins.draft = null }
  }

  /* =====================================================================
   * 6. 动作
   * ===================================================================== */
  // 未保存守卫：覆盖所有“离开”入口（隐性约束 §6.5）
  function guard(next, opts) {
    const o = opts || {}
    if (memDirty() && !o.skipMem) return openGuard('mem', next, o)
    if (chapDirty() && !o.skipChap) return openGuard('chap', next, o)
    next()
  }
  function openGuard(kind, next, o) {
    const promote = o.kind === 'promote'
    const msg = kind === 'mem' ? t('guard.msg.mem', { title: S.mm.baseline.title }) : S.ins.editing === 'new' ? t('guard.msg.new') : t('guard.msg.chap', { n: chapNumOf(S.ins.editing) })
    const discard = () => { closeModal(); if (kind === 'mem') { S.mm.draft = clone(S.mm.baseline); S.mm.errors = {}; S.mm.saveError = '' } else { S.ins.editing = null; S.ins.draft = null; S.ins.error = '' } up(); guard(next, o) }
    const save = () => { closeModal(); if (kind === 'mem') saveMemory(() => guard(next, o)); else saveChapter(() => guard(next, o)) }
    openModal({
      title: promote ? t('guard.promote.title') : t('guard.title'), message: msg,
      buttons: [
        { label: t('guard.keep'), variant: 'outline', onClick: closeModal, autofocus: true },
        { label: promote ? t('guard.promote.discard') : t('guard.discard'), variant: 'outline', onClick: discard },
        { label: promote ? t('guard.promote.save') : t('guard.save'), variant: 'primary', onClick: save },
      ],
    })
  }

  function setView(v) {
    if (S.view === v) return
    guard(() => { S.view = v; S.menu = null; up() })
  }
  function refresh() {
    guard(() => {
      S.refreshing = true; up()
      setTimeout(() => { S.refreshing = false; toast(t('toast.refreshed')); up() }, 650)
    })
  }
  function toggleFocus() { S.focus = !S.focus; hideTip(); up() }

  // —— 待确认 ——
  function acceptDraft(id) {
    const P = S.pd
    const d = S.D.pending.find((x) => x.id === id)
    if (!d || P.busy[id] || P.leaving[id]) return
    P.busy[id] = 'accept'; P.errors[id] = ''; up()
    setTimeout(() => {
      P.busy[id] = null
      const res = applyAccept(d)
      if (!res.ok) { P.errors[id] = res.error; up(); return }
      P.leaving[id] = true
      toast(res.text, res.opts)
      up()
    }, 520)
  }
  function applyAccept(d) {
    const D = S.D, L = D.limits, dest = destOf(d)
    if (dest.kind === 'blocked') return { ok: false, error: t('pd.err.blocked') }
    if (dest.kind === 'overwrite' || dest.kind === 'append') {
      if (dest.kind === 'overwrite' && (S.pv.sim === 'section-moved' || !dest.section)) return { ok: false, error: t('pd.err.sectionMoved', { title: d.chapterTitle }) }
      const before = agentsBytesOf(D.agents)
      const next = clone(D.agents)
      if (!next.exists) { next.exists = true; next.sections = [] }
      let n
      if (dest.kind === 'overwrite') { const i = D.agents.sections.indexOf(dest.section); next.sections[i].body = d.body; n = i + 1 }
      else { next.sections.push({ uid: nextUid(), name: d.title, body: d.body }); n = next.sections.length }
      const after = agentsBytesOf(next)
      if (after > L.maxAgentsBytes && after > before) return { ok: false, error: t('pd.err.full', { after: kb(after), max: kb(L.maxAgentsBytes) }) }
      next.mtime = nowISO()
      D.agents = next
      if (dest.kind === 'overwrite' && dest.alsoRemove) {
        if (S.pv.sim === 'replace-failed') {
          const oldKey = memKey(dest.alsoRemove)
          return { ok: true, text: t('toast.replaceFailed', { n, title: dest.alsoRemove.title }), opts: { persistent: true, tone: 'warn', action: { label: t('toast.replaceFailed.go'), run: () => openMemory(oldKey) } } }
        }
        D.memories = D.memories.filter((m) => m !== dest.alsoRemove)
      }
      return { ok: true, text: t('toast.wroteChapter', { n }), opts: { action: { label: t('toast.view'), run: () => gotoChapter(n - 1) } } }
    }
    // 按需草稿 → 记忆库
    const target = D.memories.filter((m) => m.scope === d.scope)
    const replacing = dest.kind === 'replace' && dest.old
    if (!replacing && target.length >= L.maxMemoryCount) return { ok: false, error: t('pd.err.libFull', { lib: libName(d.scope), n: target.length }) }
    const slug = PREVIEW_EXTRA.acceptSlugs[d.id] || ('memory-' + d.id.slice(-6))
    const m = { id: slug, name: slug, title: d.title, description: d.description, type: d.type, scope: d.scope, load: 'on-demand', promotable: d.scope === 'global', source: d.source, evidence: d.evidence || '', status: 'confirmed', tags: d.tags.slice(), paths: (d.paths || []).slice(), hits: 0, lastHit: null, created: nowISO(), modified: nowISO(), body: d.body }
    if ('evidenceVerified' in d) m.evidenceVerified = d.evidenceVerified
    if (replacing) D.memories = D.memories.filter((x) => x !== dest.old)
    D.memories.push(m)
    const key = memKey(m)
    const text = replacing ? t('toast.wroteReplace', { lib: libName(d.scope), title: dest.old.title }) : t('toast.wroteMem', { lib: libName(d.scope) })
    return { ok: true, text, opts: { action: { label: t('toast.view'), run: () => openMemory(key) } } }
  }
  function discardDraft(id) {
    const d = S.D.pending.find((x) => x.id === id)
    if (!d || S.pd.busy[id] || S.pd.leaving[id]) return
    openModal({
      title: t('pd.discard.title'), tone: 'danger', message: t('pd.discard.msg', { title: d.title }),
      buttons: [
        { label: t('dlg.cancel'), variant: 'outline', onClick: closeModal, autofocus: true },
        { label: t('pd.discard.ok'), variant: 'danger', onClick: () => { closeModal(); S.pd.leaving[id] = true; toast(t('toast.discarded')); up() } },
      ],
    })
  }
  function finishLeave(id) {
    const list = S.D.pending
    const idx = list.findIndex((x) => x.id === id)
    S.D.pending = list.filter((x) => x.id !== id)
    delete S.pd.leaving[id]; delete S.pd.errors[id]
    up()
    // 焦点交给下一张卡，键盘流不断
    const nextId = (S.D.pending[idx] || S.D.pending[idx - 1] || {}).id
    if (nextId) focusLater(`[data-draft="${nextId}"]`)
  }
  function moveDraft(delta) {
    const cards = Array.from(document.querySelectorAll('.wsm-draft'))
    if (!cards.length) return
    const cur = cards.indexOf(document.activeElement && document.activeElement.closest('.wsm-draft'))
    const i = Math.max(0, Math.min(cards.length - 1, cur < 0 ? (delta > 0 ? 0 : cards.length - 1) : cur + delta))
    cards[i].focus()
    cards[i].scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' })
  }
  function currentDraftId() {
    const el = document.activeElement && document.activeElement.closest && document.activeElement.closest('.wsm-draft')
    if (el) return el.dataset.draft
    const first = S.D.pending.find((d) => !S.pd.leaving[d.id])
    return first && first.id
  }

  // —— 记忆 ——
  function openMemory(key) {
    guard(() => {
      const m = findMem(key)
      if (!m) return
      S.view = 'memories'
      if (!visibleMems().some((x) => memKey(x) === key)) { S.mm.query = ''; S.mm.type = 'all'; S.mm.scope = 'all' }
      if (S.mm.sel !== key) setSelection(m)
      if (S.size === 'narrow') S.mm.view = 'detail'
      up()
    })
  }
  function selectMemory(key) {
    if (S.mm.sel === key) { if (S.size === 'narrow') { S.mm.view = 'detail'; up() } return }
    guard(() => { const m = findMem(key); if (m) { setSelection(m); if (S.size === 'narrow') S.mm.view = 'detail'; up() } })
  }
  function setFilter(patchObj) {
    const willHide = memDirty() && !visibleMems(patchObj).some((m) => memKey(m) === S.mm.sel)
    const apply = () => { Object.assign(S.mm, patchObj); up() }
    if (willHide) guard(apply); else apply()
  }
  function gotoMemories(scope) { guard(() => { S.view = 'memories'; S.mm.scope = scope; S.mm.type = 'all'; S.mm.query = ''; if (S.size === 'narrow') S.mm.view = 'list'; up() }) }
  function editDraft(patchObj) { Object.assign(S.mm.draft, patchObj); S.mm.saveError = ''; up() }

  function saveMemory(onDone) {
    const M = S.mm, D = S.D, L = D.limits
    if (!M.draft || M.saving) return false
    const m = findMem(M.sel)
    if (!m) return false
    const errs = validateDraft(M.draft)
    const moved = M.draft.scope !== m.scope
    const target = D.memories.filter((x) => x.scope === M.draft.scope && x !== m)
    if (!errs.slug && target.some((x) => x.id === M.draft.slug)) {
      if (moved) { M.saveError = t('err.target.exists', { lib: libName(M.draft.scope), id: M.draft.slug }); up(); return false }
      errs.slug = t('err.slug.taken', { lib: libName(m.scope), id: M.draft.slug })
    }
    M.errors = errs
    if (Object.keys(errs).length) { M.saveError = t('err.fix'); up(); focusLater('.wsm-panel [aria-invalid="true"], .wsm-panel .wsm-slug[data-invalid] input'); return false }
    if (moved && target.length >= L.maxMemoryCount) { M.saveError = t('err.library.full', { lib: libName(M.draft.scope), n: target.length }); up(); return false }
    M.saving = true; M.saveError = ''; up()
    setTimeout(() => {
      const d = M.draft
      Object.assign(m, { id: d.slug, name: d.slug, title: d.title.trim(), description: d.description.trim(), type: d.type, scope: d.scope, tags: d.tags.slice(), body: d.body, modified: nowISO(), promotable: d.scope === 'global' || m.promotable })
      M.sel = memKey(m); M.baseline = clone(d); M.draft = clone(d); M.saving = false
      toast(moved ? t('toast.savedMoved', { lib: libName(m.scope) }) : t('toast.saved'))
      up()
      if (onDone) onDone()
    }, 420)
    return true
  }
  function discardMemoryEdits() {
    if (!memDirty()) return
    openModal({
      title: t('mm.discard.title'), message: t('mm.discard.msg', { title: S.mm.baseline.title }),
      buttons: [
        { label: t('guard.keep'), variant: 'outline', onClick: closeModal, autofocus: true },
        { label: t('mm.discard.ok'), variant: 'danger', onClick: () => { closeModal(); S.mm.draft = clone(S.mm.baseline); S.mm.errors = {}; S.mm.saveError = ''; S.mm.tagInput = null; up() } },
      ],
    })
  }
  function deleteMemory(key) {
    const m = findMem(key); if (!m) return
    openModal({
      title: t('mm.del.title'), tone: 'danger',
      message: t('mm.del.msg', { title: m.title, lib: libName(m.scope) }),
      extra: [h('p', { key: 'h' }, t('mm.del.history')), h('code', { key: 'p', className: 'wsm-dialog-path' }, historyDir(m.scope))],
      buttons: [
        { label: t('dlg.cancel'), variant: 'outline', onClick: closeModal, autofocus: true },
        { label: t('mm.del.ok'), variant: 'danger', onClick: () => {
          closeModal()
          S.D.memories = S.D.memories.filter((x) => x !== m)
          if (S.mm.sel === key) { setSelection(null); S.mm.view = 'list' }
          toast(t('toast.deleted', { title: m.title })); up()
        } },
      ],
    })
  }
  function demoteHeadings(body) { return String(body).split('\n').map((l) => l.replace(/^#{1,2}\s+/, '### ')).join('\n') }
  function promoteMemory(key) {
    const run = () => {
      const m = findMem(key); if (!m) return
      const D = S.D, L = D.limits
      const before = agentsBytesOf(D.agents)
      const next = clone(D.agents); if (!next.exists) { next.exists = true; next.sections = [] }
      next.sections.push({ uid: nextUid(), name: m.title, body: demoteHeadings(m.body) })
      const after = agentsBytesOf(next)
      const full = after > L.maxAgentsBytes
      const n = next.sections.length
      const extra = []
      if (m.scope === 'project') extra.push(h('p', { key: 'fp' }, t('mm.promote.fromProject')))
      extra.push(h('div', { key: 'im', className: 'wsm-dialog-impact', 'data-tone': full ? 'over' : null }, Icon(full ? 'warn' : 'arrowUp', 14),
        h('span', null, full ? t('mm.promote.full', { max: kb(L.maxAgentsBytes), after: kb(after) }) : t('mm.promote.budget', { before: kb(before), after: kb(after), max: kb(L.maxAgentsBytes) }))))
      extra.push(h('p', { key: 'hi' }, t('mm.promote.history')))
      openModal({
        title: t('mm.promote.title'), message: t('mm.promote.msg', { title: m.title, n, lib: libName(m.scope) }), extra,
        buttons: [
          { label: t('dlg.cancel'), variant: 'outline', onClick: closeModal, autofocus: true },
          { label: t('mm.promote.ok'), variant: 'primary', disabled: full, onClick: () => {
            closeModal()
            next.mtime = nowISO(); D.agents = next
            D.memories = D.memories.filter((x) => x !== m)
            if (S.mm.sel === key) { setSelection(null); S.mm.view = 'list' }
            toast(t('toast.promoted', { n }), { action: { label: t('toast.view'), run: () => gotoChapter(n - 1) } })
            up()
          } },
        ],
      })
    }
    guard(run, { kind: 'promote' })
  }

  // —— 指令 ——
  const chapNumOf = (uid) => S.D.agents.sections.findIndex((s) => s.uid === uid) + 1
  function startEditChapter(uid) {
    if (S.ins.editing === uid) return
    guard(() => {
      const sec = S.D.agents.sections.find((s) => s.uid === uid); if (!sec) return
      Object.assign(S.ins, { editing: uid, draft: { title: sec.name, body: sec.body }, baseline: { title: sec.name, body: sec.body }, error: '' })
      up(); focusLater(`[data-chap-body="${uid}"]`)
    }, { skipMem: true })
  }
  function startNewChapter() {
    guard(() => {
      Object.assign(S.ins, { editing: 'new', draft: { title: '', body: '' }, baseline: { title: '', body: '' }, error: '' })
      up(); focusLater('[data-chap-input="new"]')
      afterQueue.push(() => { const el = document.querySelector('[data-chap="new"]'); if (el) el.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' }) })
    }, { skipMem: true })
  }
  function cancelChapter() {
    const exit = () => { S.ins.editing = null; S.ins.draft = null; S.ins.error = ''; up() }
    if (!chapDirty()) return exit()
    openModal({
      title: t('in.discard.title'), message: S.ins.editing === 'new' ? t('in.discard.msgNew') : t('in.discard.msg', { n: chapNumOf(S.ins.editing) }),
      buttons: [
        { label: t('in.keep'), variant: 'outline', onClick: closeModal, autofocus: true },
        { label: t('in.discard.ok'), variant: 'danger', onClick: () => { closeModal(); exit() } },
      ],
    })
  }
  function saveChapter(onDone) {
    const I = S.ins, D = S.D, L = D.limits
    if (I.editing == null || I.saving) return false
    const title = I.draft.title.replace(/\s+/g, ' ').trim()
    const isNew = I.editing === 'new'
    if (!title) { I.error = t('in.err.emptyTitle'); up(); focusLater(`[data-chap-input="${I.editing}"]`); return false }
    if (D.agents.sections.some((s) => s.uid !== I.editing && s.name === title)) { I.error = t('in.err.dup', { title }); up(); focusLater(`[data-chap-input="${I.editing}"]`); return false }
    const next = clone(D.agents)
    if (!next.exists) { next.exists = true; next.sections = [] }
    let idx
    if (isNew) { next.sections.push({ uid: nextUid(), name: title, body: I.draft.body }); idx = next.sections.length - 1 }
    else { idx = next.sections.findIndex((s) => s.uid === I.editing); next.sections[idx].name = title; next.sections[idx].body = I.draft.body }
    const before = agentsBytesOf(D.agents), after = agentsBytesOf(next)
    if (after > L.maxAgentsBytes && after > before) { I.error = t('in.err.full', { after: kb(after), max: kb(L.maxAgentsBytes) }); up(); return false }
    I.saving = true; I.error = ''; up()
    setTimeout(() => {
      next.mtime = nowISO(); D.agents = next
      const uid = next.sections[idx].uid
      Object.assign(I, { saving: false, editing: null, draft: null, baseline: null, flash: uid })
      toast(isNew ? t('toast.chapterAdded', { n: idx + 1, title }) : t('toast.chapterSaved', { n: idx + 1 }))
      up()
      setTimeout(() => { if (S.ins.flash === uid) { S.ins.flash = null; up() } }, 1800)
      if (onDone) onDone()
    }, 360)
    return true
  }
  function renumberBody(body, n) { return String(body).replace(/^(###\s+)\d+\.(\d+)/gm, (_, p, sub) => `${p}${n}.${sub}`) }
  function deleteChapter(uid) {
    const D = S.D, idx = D.agents.sections.findIndex((s) => s.uid === uid); if (idx < 0) return
    const sec = D.agents.sections[idx]
    openModal({
      title: t('in.del.title', { n: idx + 1 }), tone: 'danger',
      message: t('in.del.msg', { title: sec.name }), extra: [h('p', { key: 'b' }, t('in.del.backup', { k: D.limits.historyLimit }))],
      buttons: [
        { label: t('dlg.cancel'), variant: 'outline', onClick: closeModal, autofocus: true },
        { label: t('in.del.ok'), variant: 'danger', onClick: () => {
          closeModal()
          const next = clone(D.agents); next.sections.splice(idx, 1)
          next.sections.forEach((s, i) => { s.body = renumberBody(s.body, i + 1) })
          next.mtime = nowISO(); D.agents = next
          if (S.ins.editing === uid) { S.ins.editing = null; S.ins.draft = null }
          toast(t('toast.chapterDeleted', { n: idx + 1, title: sec.name })); up()
        } },
      ],
    })
  }
  function gotoChapter(i) {
    guard(() => {
      S.view = 'instructions'; S.ins.tab = 'global'; S.ins.current = i
      const sec = S.D.agents.sections[i]; if (sec) S.ins.flash = sec.uid
      up()
      afterQueue.push(() => scrollToChapter(i, false))
      setTimeout(() => { S.ins.flash = null; up() }, 1800)
    })
  }
  function scrollToChapter(i, smooth) {
    const sc = document.querySelector('.wsm-panel [data-scroll="instructions"]')
    const sec = S.D.agents.sections[i]
    const el = sec && document.querySelector(`[data-chap="${sec.uid}"]`)
    if (!sc || !el) return
    const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - (S.size === 'narrow' ? 56 : 12)
    sc.scrollTo({ top, behavior: smooth && !reducedMotion() ? 'smooth' : 'auto' })
  }
  function openInEditor(id) {
    const eds = S.D.editors
    const chosen = id != null ? id : S.ins.editor
    let ed = chosen ? eds.find((e) => e.id === chosen) : eds.find((e) => e.id !== 'system')
    if (!ed) ed = eds[eds.length - 1]
    if (id != null) S.ins.editor = id
    toast(ed.id === 'system' ? t('toast.openedSystem') : t('toast.opened', { app: ed.name }))
    up()
  }

  function openMenu(id, anchor, build, align) {
    if (S.menu && S.menu.id === id) { closeMenu(); return }
    hideTip()
    S.menu = { id, anchor, build, align: align || 'start', returnFocus: document.querySelector('[data-menu-anchor="' + anchor + '"]') || document.activeElement }
    up()
  }
  function closeMenu(restore) {
    const r = S.menu && S.menu.returnFocus
    S.menu = null; up()
    if (restore !== false && r && r.isConnected) focusLater(r)
  }
  let modalSeq = 0
  function openModal(m) { hideTip(); S.menu = null; m.uid = ++modalSeq; m.returnFocus = document.activeElement; S.modal = m; up() }
  function closeModal() {
    const r = S.modal && S.modal.returnFocus
    S.modal = null; up()
    if (r && r.isConnected) focusLater(r)
  }
  let toastSeq = 0
  function toast(text, opts) {
    const o = opts || {}
    const id = ++toastSeq
    S.toasts = S.toasts.concat([Object.assign({ id, text }, o)]).slice(-3)
    if (!o.persistent) setTimeout(() => dismissToast(id), 3000)
    up()
  }
  function dismissToast(id) {
    const x = S.toasts.find((y) => y.id === id)
    if (!x || x.leaving) return
    x.leaving = true; up()
    setTimeout(() => { S.toasts = S.toasts.filter((y) => y.id !== id); up() }, reducedMotion() ? 0 : 180)
  }

  /* ---------- 浮层 ---------- */
  function MenuLayer(s) {
    if (!s.menu) return null
    const items = s.menu.build()
    return h('div', { key: 'menu-' + s.menu.id, className: 'wsm-menu', role: 'menu', 'data-menu-material': 'translucent', onMount: placeMenu, onUpdate: placeMenu, onKeyDown: menuKey },
      items.map((it) => it.sep ? h('div', { key: it.key, className: 'wsm-menu-sep', role: 'separator' })
        : h('button', { key: 'i' + it.key, type: 'button', className: 'wsm-menu-item', role: it.checked != null ? 'menuitemradio' : 'menuitem', 'aria-checked': it.checked != null ? String(!!it.checked) : null, 'data-danger': it.danger ? 'true' : null, disabled: !!it.disabled, tabIndex: -1,
          onClick: () => { const r = S.menu && S.menu.returnFocus; S.menu = null; if (r && r.isConnected) r.focus({ preventScroll: true }); up(); it.onSelect() } },
        it.icon ? h('span', { className: 'wsm-menu-ic' }, it.icon) : null,
        h('span', { className: 'wsm-menu-text' }, h('span', { className: 'wsm-menu-label' }, it.label), it.desc ? h('span', { className: 'wsm-menu-desc' }, it.desc) : null),
        it.checked ? Icon('check', 14, 'wsm-menu-check') : null)))
  }
  function placeMenu(el) {
    const m = S.menu; if (!m) return
    const anchor = document.querySelector(`[data-menu-anchor="${m.anchor}"]`)
    const panel = el.closest('.wsm-panel')
    if (!anchor || !panel) { closeMenu(false); return }
    const a = anchor.getBoundingClientRect(), p = panel.getBoundingClientRect()
    const w = el.offsetWidth, hh = el.offsetHeight
    let left = m.align === 'end' ? a.right - w : a.left
    left = Math.max(p.left + 8, Math.min(left, p.right - w - 8))
    let top = a.bottom + 4
    if (top + hh > p.bottom - 8 && a.top - 4 - hh > p.top + 8) top = a.top - 4 - hh
    el.style.left = Math.round(left) + 'px'; el.style.top = Math.round(top) + 'px'
    if (!el.hasAttribute('data-placed')) {
      el.setAttribute('data-placed', '')
      const first = el.querySelector('.wsm-menu-item[aria-checked="true"]:not(:disabled)') || el.querySelector('.wsm-menu-item:not(:disabled)')
      if (first) first.focus({ preventScroll: true })
    }

    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus() }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus() }
    else if (e.key === 'Home') { e.preventDefault(); items[0].focus() }
    else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus() }

        x.persistent ? IconBtn({ icon: 'close', label: t('toast.close'), tip: false, size: 12, onClick: () => dismissToast(x.id) }) : null)))

  /* ---- Tooltip（悬停 450ms / 键盘聚焦 600ms；Esc、滚动、按下时隐藏） ---- */
  let tipEl = null, tipTimer = 0, tipAnchor = null, tipPending = null
  function ensureTip() { if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'wsm-tooltip'; tipEl.id = 'wsm-tooltip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl) } return tipEl }
  function showTipFor(el, delay) {
    if (tipPending === el) return
    clearTimeout(tipTimer)
    tipPending = el
    tipTimer = setTimeout(() => {
      tipPending = null
      if (!el.isConnected || S.modal) return
      const text = el.getAttribute('data-tip'); if (!text) return
      const tip = ensureTip()
      tip.textContent = text; tip.removeAttribute('data-show'); tip.style.left = '0px'; tip.style.top = '0px'
      const a = el.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight
      let top = a.bottom + 8
      if (top + hh > window.innerHeight - 8) top = a.top - 8 - hh

  const PV = {
    title: '记忆面板 · 重设计预览', theme: '主题', light: '浅色', dark: '深色', width: '面板宽度', data: '数据', normal: '正常', empty: '空', loading: '加载中', error: '出错',
    sim: '模拟写入', ok: '成功', replaceFailed: '旧记忆没删掉', sectionMoved: '章节已变动', note: '所有修改只在页面内存里，刷新即还原',

  function PvGroup(label, opts, value, onPick) {

    if ('width' in patchObj) { S.pv.width = patchObj.width; S.size = sizeFor(patchObj.width); S.pw = patchObj.width }

  }
  function syncPreviewUrl() {
    try {
      const q = new URLSearchParams(location.search)
      q.set('theme', S.pv.theme); q.set('w', String(S.pv.width)); q.set('data', S.pv.data)
      history.replaceState(null, '', location.pathname + '?' + q.toString())
    } catch (err) { /* file:// 下某些浏览器不允许，忽略 */ }
  }
  function App(s) {
    return h('div', { className: 'pv-root', key: 'pv' },

  /* =====================================================================
   * 10. 全局监听与启动

  let ro = null
  function observePanel(el) {
    if (!ro) ro = new ResizeObserver((entries) => {
      const w = entries[0].contentRect.width
      const size = w < 560 ? 'narrow' : w < 900 ? 'compact' : 'wide'

    })
    ro.observe(el)
  }
  const sizeFor = (w) => (w < 560 ? 'narrow' : w < 900 ? 'compact' : 'wide')
  const isTyping = (el) => !!el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !['button', 'checkbox', 'radio'].includes(el.type)) || el.isContentEditable)

  document.addEventListener('keydown', (e) => {
    const panel = document.querySelector('.wsm-panel')
    if (!panel || S.modal) return
    const ae = document.activeElement
    if (!(panel.contains(ae) || ae === document.body || ae == null)) return
    if (e.key === 'Escape') hideTip()
    if (S.menu) { if (e.key === 'Escape') { e.preventDefault(); closeMenu() } return }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 's') {
      if (S.view === 'memories' && memDirty()) { e.preventDefault(); saveMemory() }
      else if (S.view === 'instructions' && S.ins.editing != null) { e.preventDefault(); saveChapter() }
      return

    if (e.key === 'Escape') {

    if (isTyping(e.target) || e.ctrlKey || e.metaKey || e.altKey || isIme(e) || !S.D) return

    const theme = q.get('theme') === 'dark' ? 'dark' : 'light'
    const w = Number(q.get('w')); const width = [340, 640, 960, 1200].includes(w) ? w : 640

    document.documentElement.dataset.theme = theme
    S.ins.editor = (RAW.localStorage && RAW.localStorage['dsh-workspace-memory:editor']) || ''
    loadData(data)
    const view = q.get('view'); if (NAV.includes(view)) S.view = view
    if (q.get('ins') === 'project') S.ins.tab = 'project'
    if (q.get('flow') === '1') S.ov.flowOpen = true
    rootEl = document.getElementById('pv-app')
    render()
    const memId = q.get('mem')
    if (memId && S.D) {
      const m = S.D.memories.find((x) => x.id === memId)
      if (m) { S.view = 'memories'; setSelection(m); if (q.get('detail') === '1' || S.size === 'narrow') S.mm.view = 'detail'; up() }
    }
    // 自检钩子（只读）：控制台查看当前状态
    window.__wsmPreview = { state: S, render: up }
  }
