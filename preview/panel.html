<!--
  dsh-workspace-memory · 右侧栏「记忆」面板重设计 · 静态预览
  - 单文件、零外部资源；所有修改只存在页面内存里。
  - 三段样式：host-emulation（宿主 token 与全局基础样式，移植时不需要）、
    preview-chrome（预览控制条与宿主外框，移植时不需要）、wsm-styles（插件样式，整块搬走）。
  - 示例数据全部虚构（panel-sample-data.json + 文件内 PREVIEW_EXTRA 补充段）。
  - URL 参数便于截图：?theme=dark&w=340&data=empty&view=pending&mem=<id>&ins=project&detail=1
-->
<style id="host-emulation">
/*
 * DeepSeek Harness 宿主主题 token —— 从 app.asar 抽取并解析（DSH 0.2.2-rc.3 打包件）。
 * 来源：dsh/node_modules/@deepseek-ai/dsh-client-ui-theme/src/styles/design-platform.css
 *       （alias→static 链已解析为最终 rgb/rgba；color-mix(in srgb, …) 已按 sRGB 线性插值算出）
 *       base.css（圆角/字体/动效）、gradient-shadow-text.css（阴影/elevation/字体组合）。
 *
 * 注意：宿主真实切换机制不是 :root[data-theme]——宿主把 token 声明在 `body` 上，
 * 深色态是 `body[data-ds-dark-theme]`（布尔属性，ThemeRuntime/boot 脚本 toggle）。
 * 这里按静态预览需要改写成 :root[data-theme="light|dark"]；插件代码里只引用 var(--dsw-alias-*)，不要复制这些字面值。
 * Windows 下宿主未覆盖任何颜色（macOS 才有 html[data-platform='darwin'] 的菜单/侧栏玻璃覆盖，已省略）。
 */

/* ---- 与主题无关的共享常量（两套主题相同） ---- */
:root {
  --dsh-font-family-text-default: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --dsw-font-family: var(--dsh-font-family-text-default);
  --dsw-font-family-brand: 'Montserrat', var(--dsh-font-family-text-default);
  --dsh-font-family-code-default: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas,
    'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  --ds-font-family-code: var(--dsh-font-family-code-default);

  /* 用户可调字号（宿主写在 body 上，默认值如下） */
  --dsh-content-font-size: 14px;          /* 正文 10–22，默认 14 */
  --dsh-code-font-size: 11px;             /* 代码块 10–16，默认 11 */
  --dsh-terminal-font-size: 13px;
  --dsh-content-font-delta: calc(var(--dsh-content-font-size) - 14px);
  --dsh-content-font-size-secondary: min(calc(var(--dsh-content-font-size) - 1px), max(13px, calc(var(--dsh-content-font-size) - 2px)));

  /* 排版组合 token（font 简写） */
  --dsw-font-xl-24: 600 24px/32px var(--dsw-font-family);
  --dsw-font-l-20: 500 20px/28px var(--dsw-font-family);
  --dsw-font-m-18: 500 16px/28px var(--dsw-font-family);
  --dsw-font-base-16: 16px/24px var(--dsw-font-family);
  --dsw-font-base-strong-16: 500 16px/24px var(--dsw-font-family);
  --dsw-font-s-14: 14px/22px var(--dsw-font-family);
  --dsw-font-s-strong-14: 500 14px/22px var(--dsw-font-family);
  --dsw-font-xs-13: 13px/20px var(--dsw-font-family);
  --dsw-font-xs-strong-13: 500 13px/20px var(--dsw-font-family);
  --dsw-font-xxs-12: 12px/18px var(--dsw-font-family);
  --dsw-font-xxs-strong-12: 500 12px/18px var(--dsw-font-family);
  --dsw-font-xxxs-11: 11px/14px var(--dsw-font-family);
  --dsw-font-xxxs-strong-11: 500 11px/14px var(--dsw-font-family);

  /* 圆角 */
  --dsw-radius-xs: 4px;
  --dsw-radius-sm: 8px;
  --dsw-radius-md: 12px;
  --dsw-radius-lg: 16px;
  --dsw-radius-xl: 20px;
  --dsw-radius-panel: 28px;

  /* 动效 */
  --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ds-transition-duration: 0.2s;
  --ds-transition-duration-fast: 0.1s;
  --ds-transition-duration-slow: 0.3s;

  /* 焦点环（focus.css） */
  --dsw-focus-ring-width: 2px;

  /* 阴影（两套主题同值） */
  --dsw-shadow-lv1: 0 2px 4px 0 rgba(0, 0, 0, 0.05);
  --dsw-shadow-lv1-blur: 0 4px 12px 0 rgba(0, 0, 0, 0.02);
  --dsw-shadow-lv2: 0 4px 12px 0 rgba(0, 0, 0, 0.02), 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  --dsw-shadow-lv3: 0 0 1px 0 rgba(0, 0, 0, 0.2), 0 0 4px 0 rgba(0, 0, 0, 0.02), 0 12px 32px 0 rgba(0, 0, 0, 0.08);
  --dsw-mask-blur: none;
  --dsw-menu-backdrop-filter: blur(40px) saturate(150%);

  /* 发丝线宽：宿主按 DPR 写在 <html> 上 = max(1, floor(0.5*dpr))/dpr px；1x 屏为 1px，2x 屏为 0.5px */
  --dsh-hairline-width: 0.5px;
}

/* elevation 三件套：宿主在 `body, body *` 上逐元素声明，使组件可重绑 --dsw-elevation-stroke-color（菜单列表重绑 border-l1、浮窗 l2）。 */
:root, :root * {
  --dsw-elevation-stroke: 0 0 0 0.5px var(--dsw-elevation-stroke-color);
  --dsw-elevation-panel: var(--dsw-elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, 0.03), 0 0 16px 0 rgba(0, 0, 0, 0.02);
  --dsw-elevation-prominent: var(--dsw-elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05);
  --dsw-elevation-soft: var(--dsw-elevation-stroke), 0 4px 16px 0 rgba(0, 0, 0, 0.03), 0 0 24px 0 rgba(0, 0, 0, 0.03);
}

  border-radius: 8px; background: var(--dsw-alias-bg-layer-1);
  --dsw-elevation-stroke-color: var(--dsw-alias-border-l3);
  box-shadow: var(--dsw-elevation-soft);
  transition: transform .18s var(--wsm-ease);
}
.wsm-seg > button {
  position: relative; z-index: 1; min-width: 0;
  height: 26px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
  color: var(--dsw-alias-label-secondary); font-weight: 500; white-space: nowrap; transition: color .16s ease;
}
.wsm-seg > button[aria-checked="true"] { color: var(--dsw-alias-label-primary); }
@media (hover: hover) { .wsm-seg > button:hover { color: var(--dsw-alias-label-primary); } }
.wsm-seg > button:focus-visible { outline-offset: -2px; }
.wsm-seg[data-size="sm"] { padding: 2px; border-radius: 9px; }
.wsm-seg[data-size="sm"] .wsm-seg-ink { top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px - (var(--n) - 1) * 2px) / var(--n)); border-radius: 7px; }
.wsm-seg[data-size="sm"] > button { height: 22px; padding: 0 9px; font-size: 12px; line-height: 18px; border-radius: 7px; }
.wsm-seg[data-stretch] { display: grid; width: 100%; }

/* ---------- 输入 ---------- */
.wsm-input {
  display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px 0 8px; min-width: 0;
  border-radius: 12px; background: var(--dsw-alias-bg-layer-1);
  box-shadow: inset 0 0 0 .5px var(--dsw-alias-border-l4);
  color: var(--dsw-alias-label-tertiary); transition: box-shadow .12s ease;
}
.wsm-input:focus-within { box-shadow: inset 0 0 0 1px var(--dsw-alias-state-business-primary); }
.wsm-input input {
  flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent;
  font-size: 13px; color: var(--dsw-alias-label-primary);
}
.wsm-input input::placeholder { color: var(--dsw-alias-label-caption); }
.wsm-input input:focus-visible { outline: none; }
.wsm-input .wsm-kbd { opacity: .9; }
.wsm-input .wsm-iconbtn { width: 22px; height: 22px; border-radius: 6px; }
.wsm-field {
  width: 100%; min-width: 0; border: 0; outline: 0; resize: none;
  border-radius: 12px; background: var(--dsw-alias-bg-layer-1);
  box-shadow: inset 0 0 0 .5px var(--dsw-alias-border-l4);
  color: var(--dsw-alias-label-primary); font-size: 13px; line-height: 22px; padding: 10px 12px;
  transition: box-shadow .12s ease;
}
.wsm-field:focus { box-shadow: inset 0 0 0 1px var(--dsw-alias-state-business-primary); }
.wsm-field:focus-visible { outline: none; }
.wsm-field[aria-invalid="true"] { box-shadow: inset 0 0 0 1px var(--dsw-alias-state-error-primary); }
.wsm-field::placeholder { color: var(--dsw-alias-label-caption); }
.wsm-err { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-state-error-primary); }
.wsm-err .wsm-ic { margin-top: 2px; }

/* ---------- 下拉触发器（PermissionSelect 形态） ---------- */
.wsm-select {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  height: 28px; padding: 0 6px 0 8px; margin-left: -8px; border: 0; border-radius: 8px;
  background: transparent; color: var(--dsw-alias-label-primary); cursor: pointer; white-space: nowrap;
  transition: background-color .12s ease;
}
.wsm-select > span { overflow: hidden; text-overflow: ellipsis; }
.wsm-select .wsm-ic { color: var(--dsw-alias-label-secondary); }
.wsm-select .wsm-select-chev { color: var(--dsw-alias-label-caption); transition: transform .12s ease; }
.wsm-select[aria-expanded="true"] .wsm-select-chev { transform: rotate(180deg); }
@media (hover: hover) { .wsm-select:hover { background: var(--dsw-alias-interactive-bg-hover); } }
.wsm-select[aria-expanded="true"] { background: var(--dsw-alias-interactive-bg-active); }
.wsm-select[data-changed] { box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--dsw-alias-state-warn-primary) 60%, transparent); }

/* ---------- 滚动容器与页面骨架 ---------- */
.wsm-main { flex: 1; min-height: 0; display: flex; position: relative; }
.wsm-scroll { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; overscroll-behavior: contain; }
.wsm-view { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; animation: wsm-fade .16s var(--wsm-ease); }
.wsm-page { width: 100%; max-width: 960px; margin: 0 auto; padding: 20px var(--wsm-gutter) 40px; }
.wsm-pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.wsm-pagehead-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wsm-h1 { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .005em; }
.wsm-panel:not([data-size="narrow"]) .wsm-h1 { font-size: 20px; line-height: 28px; }
.wsm-pagesub { color: var(--dsw-alias-label-secondary); text-wrap: pretty; }
.wsm-ws {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  color: var(--dsw-alias-label-secondary); font-size: 13px;
}
.wsm-ws .wsm-ic { color: var(--dsw-alias-label-tertiary); }
.wsm-ws span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsm-section { margin-top: 28px; min-width: 0; }
.wsm-section-head { display: flex; align-items: baseline; gap: 8px; min-height: 22px; }
.wsm-h2 { font-size: 14px; line-height: 22px; font-weight: 500; }
.wsm-count { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); font-variant-numeric: tabular-nums; }
.wsm-section-aside { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--dsw-alias-label-secondary); font-size: 12px; line-height: 18px; }
.wsm-section-sub { margin-top: 2px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); text-wrap: pretty; }
.wsm-section-body { margin-top: 12px; }

/* ---------- 总览：待确认横幅 ---------- */
.wsm-banner {
  display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 12px 12px 14px;
  border-radius: 16px;
  background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 6%, var(--dsw-alias-bg-layer-1));
  box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--dsw-alias-state-business-primary) 22%, transparent);
}
.wsm-banner-ic { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--dsw-alias-state-business-primary); background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 12%, transparent); }
.wsm-banner-main { flex: 1; min-width: 0; }
.wsm-banner-title { font-weight: 500; font-size: 14px; line-height: 20px; }
.wsm-banner-sub { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); text-wrap: pretty; }
.wsm-panel[data-size="narrow"] .wsm-banner { flex-wrap: wrap; align-items: flex-start; }
.wsm-panel[data-size="narrow"] .wsm-banner-main { flex: 1 1 calc(100% - 44px); }
.wsm-panel[data-size="narrow"] .wsm-banner .wsm-btn { margin-left: 44px; }

/* ---------- 总览：记忆地图（签名元素） ---------- */
.wsm-map { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.wsm-map-corner { grid-column: 1; }
.wsm-map-colhead { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 0 4px 2px; color: var(--dsw-alias-label-secondary); font-size: 12px; line-height: 18px; font-weight: 500; }
.wsm-map-colhead .wsm-ic { color: var(--dsw-alias-label-tertiary); }
.wsm-map-colhead small { font-size: 12px; font-weight: 400; color: var(--dsw-alias-label-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsm-map-rowhead {
  writing-mode: vertical-rl; display: flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 11px; background: var(--wsm-tint-1);
  color: var(--dsw-alias-label-secondary); font-size: 12px; line-height: 22px; font-weight: 500; letter-spacing: .14em;
}
.wsm-map-rowhead .wsm-ic { color: var(--dsw-alias-label-tertiary); }
.wsm-cell {
  position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 0;
  min-width: 0; min-height: 156px; padding: 14px 16px 12px; border: 0; border-radius: 16px; text-align: left; cursor: pointer;
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: inset 0 0 0 .5px var(--dsw-alias-border-l2);
  transition: box-shadow .16s ease, background-color .16s ease, transform .16s var(--wsm-ease);
  overflow: hidden; isolation: isolate;
}
.wsm-cell[data-load="always"] { background: color-mix(in srgb, var(--dsw-alias-label-primary) 2.5%, var(--dsw-alias-bg-layer-1)); }
/* 极轻纹理：每轮都读的格子带斜线，暗示“每轮都在占位置”；只用 token 着色 */
.wsm-cell[data-load="always"]::after {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: repeating-linear-gradient(135deg, var(--wsm-tint-1) 0 1px, transparent 1px 9px);
  -webkit-mask-image: radial-gradient(120% 90% at 100% 0%, var(--dsw-alias-label-primary) 0%, transparent 62%);
          mask-image: radial-gradient(120% 90% at 100% 0%, var(--dsw-alias-label-primary) 0%, transparent 62%);
}
@media (hover: hover) {
  .wsm-cell:hover { box-shadow: inset 0 0 0 .5px var(--dsw-alias-border-l4), var(--dsw-elevation-panel); --dsw-elevation-stroke-color: transparent; }
  .wsm-cell:hover .wsm-cell-go { opacity: 1; transform: none; }
}
.wsm-cell:active { transform: scale(.995); }
.wsm-cell:focus-visible { outline-offset: 2px; }
.wsm-cell-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.wsm-cell-glyph { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--dsw-alias-label-secondary); background: var(--wsm-tint-2); }
.wsm-cell[data-load="always"] .wsm-cell-glyph { color: var(--dsw-alias-label-primary); background: var(--wsm-tint-3); }
.wsm-cell-name { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 500; }
.wsm-cell-go { flex: none; color: var(--dsw-alias-label-caption); opacity: 0; transform: translateX(-3px); transition: opacity .16s ease, transform .16s var(--wsm-ease); }
.wsm-cell-axes { display: none; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.wsm-cell-desc { margin-top: 8px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); text-wrap: pretty; }
.wsm-cell-metric { margin-top: auto; padding-top: 14px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.wsm-cell-big { font-size: 22px; line-height: 28px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.wsm-cell-unit { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); }
.wsm-cell-right { margin-left: auto; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); font-variant-numeric: tabular-nums; }
.wsm-cell-right[data-warn] { color: var(--dsw-alias-state-warn-label); }
.wsm-cell-sub { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.wsm-cell-subrow { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); }
.wsm-cell-subrow b { font-weight: 500; color: var(--dsw-alias-label-primary); min-width: 2.6em; }
.wsm-cell-subrow i { font-style: normal; color: var(--dsw-alias-label-tertiary); }
.wsm-cell-subrow .wsm-num { margin-left: auto; }
.wsm-cell-foot { margin-top: 8px; font-size: 11px; line-height: 16px; color: var(--dsw-alias-label-caption); font-variant-numeric: tabular-nums; }
.wsm-cell-empty { margin-top: auto; padding-top: 14px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); }
.wsm-panel[data-size="narrow"] .wsm-map { grid-template-columns: minmax(0, 1fr); }
.wsm-panel[data-size="narrow"] :is(.wsm-map-corner, .wsm-map-colhead, .wsm-map-rowhead) { display: none; }
.wsm-panel[data-size="narrow"] .wsm-cell { min-height: 0; }
.wsm-panel[data-size="narrow"] .wsm-cell-axes { display: flex; }
.wsm-panel[data-size="narrow"] .wsm-cell-go { opacity: 1; transform: none; }

/* 预算条 */
.wsm-meter { position: relative; height: 4px; margin-top: 8px; border-radius: 999px; background: var(--wsm-tint-2); overflow: hidden; }
.wsm-meter > span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: color-mix(in srgb, var(--dsw-alias-label-primary) 72%, transparent); transition: width .3s var(--wsm-ease); }
.wsm-meter[data-level="warn"] > span { background: var(--dsw-alias-state-warn-primary); }
.wsm-meter[data-level="over"] > span { background: var(--dsw-alias-state-error-primary); }
.wsm-meter[data-thin] { height: 3px; }

/* ---------- 总览：每轮固定开销 ---------- */
.wsm-cost { padding: 14px 16px; border-radius: 16px; box-shadow: inset 0 0 0 .5px var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-layer-1); }
.wsm-cost-total { display: flex; align-items: baseline; gap: 6px; }
.wsm-cost-total b { font-size: 22px; line-height: 28px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.wsm-cost-total span { color: var(--dsw-alias-label-secondary); font-size: 12px; }
.wsm-cost-total em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--dsw-alias-label-tertiary); font-variant-numeric: tabular-nums; }
.wsm-stack { display: flex; gap: 2px; height: 12px; margin-top: 10px; }
.wsm-stack > span { min-width: 6px; border-radius: 3px; background: color-mix(in srgb, var(--dsw-alias-label-primary) var(--p), transparent); transition: flex-grow .3s var(--wsm-ease); }
.wsm-stack > span:first-child { border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
.wsm-stack > span:last-child { border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
.wsm-stack > span[data-hatch] { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--dsw-alias-label-primary) 22%, transparent) 0 2px, transparent 2px 4px); background-color: color-mix(in srgb, var(--dsw-alias-label-primary) 10%, transparent); }
.wsm-legend { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; column-gap: 10px; row-gap: 6px; margin-top: 12px; align-items: center; font-size: 12px; line-height: 18px; }
.wsm-legend-sw { width: 10px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--dsw-alias-label-primary) var(--p), transparent); }
.wsm-legend-sw[data-hatch] { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--dsw-alias-label-primary) 22%, transparent) 0 2px, transparent 2px 4px); background-color: color-mix(in srgb, var(--dsw-alias-label-primary) 10%, transparent); }
.wsm-legend-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dsw-alias-label-secondary); }
.wsm-legend-v { text-align: right; color: var(--dsw-alias-label-primary); font-variant-numeric: tabular-nums; }
.wsm-legend-t { text-align: right; color: var(--dsw-alias-label-tertiary); font-variant-numeric: tabular-nums; min-width: 6.5em; }
.wsm-cost-tip { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: .5px solid var(--dsw-alias-border-l2); font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); }

/* ---------- 列表行（插件管理页形态） ---------- */
.wsm-rows { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; padding: 0; list-style: none; }
.wsm-row {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0;
  padding: 8px; border: 0; border-radius: 20px; background: transparent; text-align: left; cursor: pointer;
  transition: background-color .12s ease;
}
@media (hover: hover) { .wsm-row:hover { background: var(--dsw-alias-interactive-bg-hover); } }
.wsm-row:active { background: var(--dsw-alias-interactive-bg-active); }
.wsm-row[aria-selected="true"] { background: var(--dsw-alias-interactive-bg-active); }
.wsm-row:focus-visible { outline-offset: -2px; }
.wsm-row-ic { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--dsw-alias-label-secondary); box-shadow: inset 0 0 0 .5px var(--dsw-alias-border-l3); background: var(--dsw-alias-bg-layer-1); }
.wsm-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wsm-row-title { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 500; }
.wsm-row-title > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsm-rows[data-wrap] .wsm-row { align-items: flex-start; }
.wsm-rows[data-wrap] .wsm-row-title > span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.wsm-rows[data-wrap] .wsm-row-end { padding-top: 1px; }
.wsm-scopetag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 999px; font-size: 10px; line-height: 1; font-weight: 500; white-space: nowrap; color: var(--dsw-alias-label-tertiary); box-shadow: inset 0 0 0 .5px var(--dsw-alias-border-l4); }
.wsm-scopetag[data-scope="global"] { color: var(--dsw-alias-label-secondary); background: var(--wsm-tint-1); }
.wsm-row-desc { font-size: 13px; line-height: 18px; color: var(--dsw-alias-label-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsm-row-end { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.wsm-row-time { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-caption); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wsm-row-meta { display: flex; align-items: center; gap: 5px; }
.wsm-row-meta .wsm-dot { width: 7px; height: 7px; }
.wsm-panel:not([data-size="wide"]) .wsm-mlist .wsm-row { gap: 10px; }
.wsm-panel:not([data-size="wide"]) .wsm-mlist .wsm-row-ic { width: 32px; height: 32px; border-radius: 11px; }
.wsm-row-unsaved { flex: none; width: 6px; height: 6px; border-radius: 999px; background: var(--dsw-alias-state-warn-primary); }
.wsm-rows[data-compact] .wsm-row { border-radius: 12px; padding: 6px 8px; gap: 10px; }
.wsm-rows[data-compact] .wsm-row-ic { width: 28px; height: 28px; border-radius: 9px; }
.wsm-rows[data-compact] .wsm-row-title { font-size: 13px; }
.wsm-rows[data-compact] .wsm-row-desc { font-size: 12px; }
.wsm-sub-glyph { display: inline-flex; align-items: center; gap: 4px; }
.wsm-sub-glyph .wsm-ic { color: var(--dsw-alias-label-caption); }

/* ---------- 总览：两栏布局、折叠流程图 ---------- */
.wsm-ov-grid { display: grid; grid-template-columns: minmax(0, 1fr); column-gap: 32px; }
.wsm-panel[data-size="wide"] .wsm-ov-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.wsm-disclose {
  display: flex; align-items: center; gap: 8px; width: calc(100% + 16px); margin: 0 -8px; padding: 8px;
  border: 0; border-radius: 12px; background: transparent; cursor: pointer; text-align: left;
}
@media (hover: hover) { .wsm-disclose:hover { background: var(--dsw-alias-interactive-bg-hover); } }
.wsm-disclose .wsm-h2 { flex: 1; }
.wsm-disclose .wsm-ic { color: var(--dsw-alias-label-caption); transition: transform .16s var(--wsm-ease); }
.wsm-disclose[aria-expanded="true"] .wsm-ic:last-child { transform: rotate(180deg); }
.wsm-flow { margin-top: 8px; padding: 4px 0 0; animation: wsm-fade .16s var(--wsm-ease); }
.wsm-flow-row { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 10px; }
.wsm-flow-rail { position: relative; display: flex; justify-content: center; }
.wsm-flow-rail svg { position: relative; z-index: 1; margin-top: 4px; color: var(--dsw-alias-label-tertiary); background: var(--dsw-alias-bg-base); }
.wsm-flow-row:not(:last-child) .wsm-flow-rail::before { content: ''; position: absolute; top: 18px; bottom: -4px; left: 50%; width: 0; border-left: 1px dashed var(--dsw-alias-border-l4); }
.wsm-flow-body { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding-bottom: 14px; min-width: 0; }
.wsm-flow-q { color: var(--dsw-alias-label-primary); text-wrap: pretty; }
.wsm-flow-yes { display: inline-flex; align-items: center; gap: 4px; color: var(--dsw-alias-label-tertiary); font-size: 12px; }
.wsm-flow-yes svg { color: var(--dsw-alias-label-caption); }
.wsm-flow-dest {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 7px; border-radius: 999px;
  background: var(--wsm-tint-2); color: var(--dsw-alias-label-primary); font-size: 12px; font-weight: 500; white-space: nowrap;
}
.wsm-flow-dest .wsm-ic { color: var(--dsw-alias-label-secondary); }

/* ---------- 待确认：卡片流 ---------- */
.wsm-pending .wsm-page { max-width: 760px; padding-bottom: 24px; }
.wsm-drafts { margin-top: 16px; }
.wsm-draft-slot { padding-bottom: 14px; }
.wsm-draft {

  box-shadow: inset 0 0 0 .5px var(--dsw-alias-border-l2);
  --dsh-scrollbar-thumb: var(--dsw-alias-scrollbar-bg-l2); --dsh-scrollbar-thumb-hover: var(--dsw-alias-scrollbar-hover-l2);

}

.wsm-draft-body { padding: 14px 16px 4px; }

.wsm-draft-desc { margin-top: 2px; color: var(--dsw-alias-label-secondary); text-wrap: pretty; }

.wsm-draft-note { display: inline-flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); cursor: help; }
.wsm-block-head { display: flex; align-items: center; gap: 8px; min-height: 26px; margin-bottom: 8px; }
.wsm-block-label { font-size: 12px; line-height: 18px; font-weight: 500; color: var(--dsw-alias-label-tertiary); }
.wsm-block-head .wsm-seg { margin-left: auto; }
.wsm-block-note { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); text-wrap: pretty; }

.wsm-meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }

/* 新旧对比 */

.wsm-diff-title { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px 6px 10px; border-bottom: .5px solid var(--dsw-alias-border-l2); font-size: 12px; color: var(--dsw-alias-label-tertiary); }

.wsm-toc { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 180px); overflow-y: auto; }

  position: relative; display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 5px 8px; border: 0; border-radius: 10px;
  background: transparent; text-align: left; cursor: pointer; color: var(--dsw-alias-label-secondary); transition: background-color .12s ease, color .12s ease;
}

.wsm-preamble { margin-bottom: 8px; border-radius: 14px; background: var(--wsm-tint-1); }

.wsm-chap { position: relative; padding: 16px 0 18px; border-top: .5px solid var(--dsw-alias-border-l2); scroll-margin-top: 12px; }

.wsm-projcard-main { flex: 1; min-width: 0; }
.wsm-projcard-title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; line-height: 20px; font-weight: 500; }
.wsm-projcard-sub { margin-top: 2px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); }
.wsm-projcard-body { position: relative; padding: 4px 16px 16px; border-top: .5px solid var(--dsw-alias-border-l2); padding-top: 14px; }
.wsm-projcard-body[data-clamp] { max-height: 300px; overflow: hidden; -webkit-mask-image: linear-gradient(var(--dsw-alias-label-primary) 70%, transparent); mask-image: linear-gradient(var(--dsw-alias-label-primary) 70%, transparent); }
.wsm-projcard-more { display: flex; justify-content: center; padding: 0 16px 12px; }
.wsm-projcard-missing { padding: 14px 16px 16px; border-top: .5px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-secondary); text-wrap: pretty; }
.wsm-projcard-missing p + p { margin-top: 10px; }
.wsm-note { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: var(--wsm-tint-1); color: var(--dsw-alias-label-secondary); font-size: 12px; line-height: 18px; }
.wsm-note .wsm-ic { margin-top: 2px; color: var(--dsw-alias-label-tertiary); }

/* ---------- 记忆页：列表 + 详情 ---------- */
.wsm-mem { flex: 1; min-width: 0; min-height: 0; display: flex; }
.wsm-mlist { flex: none; width: clamp(264px, 44%, 300px); min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: .5px solid var(--dsw-alias-border-l3); }
.wsm-panel[data-size="wide"] .wsm-mlist { width: 320px; }
.wsm-panel[data-size="narrow"] .wsm-mlist { width: auto; flex: 1; border-right: 0; }
.wsm-panel[data-focus] .wsm-mlist { display: none; }
.wsm-mtools { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px; }
.wsm-mtools .wsm-seg { width: 100%; display: grid; }
.wsm-libs { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); }
.wsm-libs span { display: inline-flex; align-items: center; gap: 5px; cursor: default; }
.wsm-libs b { font-weight: 500; color: var(--dsw-alias-label-secondary); font-variant-numeric: tabular-nums; }
.wsm-chips { display: flex; flex-wrap: wrap; gap: 6px 5px; }
.wsm-chip {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border: 0; border-radius: 999px; cursor: pointer;
  font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); background: transparent;
  box-shadow: inset 0 0 0 .5px var(--dsw-alias-border-l3); transition: background-color .12s ease, color .12s ease, box-shadow .12s ease;
}
.wsm-chip .wsm-ic { color: var(--dsw-alias-label-tertiary); }
.wsm-chip i { font-style: normal; color: var(--dsw-alias-label-caption); font-variant-numeric: tabular-nums; }
@media (hover: hover) { .wsm-chip:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); } }
.wsm-chip[aria-pressed="true"] { background: var(--dsw-alias-button-ghost-active-fill); color: var(--dsw-alias-label-primary); box-shadow: inset 0 0 0 1px var(--dsw-alias-button-ghost-active-border); }
.wsm-chip[aria-pressed="true"] :is(.wsm-ic, i) { color: var(--dsw-alias-label-secondary); }
.wsm-chip:disabled { opacity: .45; cursor: default; }
.wsm-mlist .wsm-scroll { padding: 2px 16px 20px; }
.wsm-mlist .wsm-rows { margin: 0 -8px; }
.wsm-detail { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.wsm-panel[data-size="narrow"] .wsm-detail { animation: wsm-push .2s var(--wsm-ease); }
.wsm-dbar { flex: none; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 8px 0 12px; }
.wsm-panel[data-size="narrow"] .wsm-dbar { padding-left: 6px; }
.wsm-crumb { display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 1; font-size: 12.5px; color: var(--dsw-alias-label-tertiary); }
.wsm-crumb span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsm-crumb b { font-weight: 500; color: var(--dsw-alias-label-secondary); white-space: nowrap; }
.wsm-back { display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 0 8px 0 4px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--dsw-alias-label-secondary); white-space: nowrap; }
@media (hover: hover) { .wsm-back:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); } }
.wsm-doc { width: 100%; max-width: 760px; margin: 0 auto; padding: 6px var(--wsm-gutter) 112px; }
.wsm-panel[data-focus][data-size="wide"] .wsm-doc { max-width: 1180px; }
.wsm-doc-title, .wsm-doc-desc {
  display: block; width: calc(100% + 16px); margin: 0 -8px; padding: 2px 8px; border: 0; outline: 0; resize: none; overflow: hidden;
  border-radius: 10px; background: transparent; color: var(--dsw-alias-label-primary);
  transition: background-color .12s ease, box-shadow .12s ease;
}
.wsm-doc-title { font-size: 20px; line-height: 28px; font-weight: 500; }
.wsm-panel[data-size="narrow"] .wsm-doc-title { font-size: 18px; line-height: 26px; }
.wsm-doc-desc { margin-top: 2px; font-size: 14px; line-height: 22px; color: var(--dsw-alias-label-secondary); }
.wsm-doc-title::placeholder, .wsm-doc-desc::placeholder { color: var(--dsw-alias-label-caption); }
@media (hover: hover) { :is(.wsm-doc-title, .wsm-doc-desc):hover { background: var(--dsw-alias-interactive-bg-hover); } }
:is(.wsm-doc-title, .wsm-doc-desc):focus { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dsw-alias-state-business-primary) 70%, transparent); }
:is(.wsm-doc-title, .wsm-doc-desc):focus-visible { outline: none; }
:is(.wsm-doc-title, .wsm-doc-desc)[aria-invalid="true"] { box-shadow: inset 0 0 0 1px var(--dsw-alias-state-error-primary); }
.wsm-props { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: start; column-gap: 12px; margin-top: 16px; padding-top: 10px; border-top: .5px solid var(--dsw-alias-border-l2); }
.wsm-panel[data-size="narrow"] .wsm-props { grid-template-columns: 84px minmax(0, 1fr); column-gap: 8px; }
.wsm-prop-k { display: flex; align-items: center; gap: 6px; min-height: 34px; color: var(--dsw-alias-label-tertiary); font-size: 13px; white-space: nowrap; }
.wsm-prop-k .wsm-ic { color: var(--dsw-alias-label-caption); }
.wsm-prop-v { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; gap: 6px; min-width: 0; min-height: 34px; padding: 3px 0; color: var(--dsw-alias-label-primary); }
.wsm-prop-v[data-col] { flex-direction: column; align-items: stretch; }
.wsm-prop-wide { grid-column: 1 / -1; padding-bottom: 6px; }
.wsm-prop-muted { color: var(--dsw-alias-label-tertiary); }
.wsm-callout { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 12px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); background: var(--wsm-tint-1); animation: wsm-fade .16s ease; text-wrap: pretty; }
.wsm-callout .wsm-ic { margin-top: 2px; color: var(--dsw-alias-label-tertiary); }
.wsm-callout[data-tone="warn"] { background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 9%, transparent); color: var(--dsw-alias-label-primary); }
.wsm-callout[data-tone="warn"] .wsm-ic { color: var(--dsw-alias-state-warn-primary); }
.wsm-callout-main { flex: 1; min-width: 0; }
.wsm-callout .wsm-btn { margin-top: 8px; }
.wsm-tagchip { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 3px 0 8px; border-radius: 999px; background: var(--dsw-alias-bg-module-platform); color: var(--dsw-alias-label-secondary); font-size: 12px; line-height: 18px; }
.wsm-tagchip button { display: grid; place-items: center; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--dsw-alias-label-caption); cursor: pointer; }
@media (hover: hover) { .wsm-tagchip button:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); } }
.wsm-taginput { width: 112px; height: 22px; padding: 0 8px; border: 0; outline: 0; border-radius: 999px; background: var(--dsw-alias-bg-layer-1); box-shadow: inset 0 0 0 1px var(--dsw-alias-state-business-primary); font-size: 12px; color: var(--dsw-alias-label-primary); }
.wsm-taginput[aria-invalid="true"] { box-shadow: inset 0 0 0 1px var(--dsw-alias-state-error-primary); }
.wsm-taginput:focus-visible { outline: none; }
.wsm-addtag { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 8px 0 5px; border: 0; border-radius: 999px; background: transparent; color: var(--dsw-alias-label-tertiary); cursor: pointer; font-size: 12px; }
@media (hover: hover) { .wsm-addtag:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); } }
.wsm-pathlist { display: flex; flex-wrap: wrap; gap: 4px; }
.wsm-pathlist code { font: 11.5px/20px var(--wsm-mono); padding: 0 6px; border-radius: 6px; background: var(--dsw-alias-bg-module-platform); color: var(--dsw-alias-label-secondary); }
.wsm-slug { display: inline-flex; align-items: center; height: 28px; max-width: 100%; min-width: 0; margin-left: -8px; padding: 0 8px; border-radius: 8px; font: 12.5px/20px var(--wsm-mono); color: var(--dsw-alias-label-secondary); transition: background-color .12s ease, box-shadow .12s ease; }
.wsm-slug input { flex: 0 1 auto; width: auto; max-width: 100%; min-width: 0; border: 0; outline: 0; padding: 0; background: transparent; font: inherit; color: var(--dsw-alias-label-primary); }
.wsm-slug input:focus-visible { outline: none; }
@media (hover: hover) { .wsm-slug:hover { background: var(--dsw-alias-interactive-bg-hover); } }
.wsm-slug:focus-within { background: transparent; box-shadow: inset 0 0 0 1px var(--dsw-alias-state-business-primary); }
.wsm-slug[data-invalid] { box-shadow: inset 0 0 0 1px var(--dsw-alias-state-error-primary); }
.wsm-slug > span { flex: none; }
.wsm-panel[data-size="narrow"] .wsm-slug { font-size: 12px; }
.wsm-editor { margin-top: 18px; }
.wsm-editor-head { display: flex; align-items: center; gap: 8px; min-height: 28px; margin-bottom: 8px; }
.wsm-editor-head .wsm-h2 { font-size: 13px; }
.wsm-editor-head .wsm-count { margin-left: auto; }
.wsm-editor-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.wsm-editor-grid[data-split] { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.wsm-editor .wsm-field { min-height: 220px; font-size: 13px; line-height: 22px; padding: 12px 14px; }
.wsm-preview-box { min-height: 220px; padding: 12px 14px; border-radius: 12px; box-shadow: inset 0 0 0 .5px var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-base); }
.wsm-preview-box[data-plain] { box-shadow: none; padding: 4px 0; }
.wsm-savebar {
  position: absolute; z-index: 6; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; max-width: calc(100% - 24px); padding: 6px 6px 6px 14px; border-radius: 16px;
  background: var(--dsw-alias-bg-layer-2); --dsw-elevation-stroke-color: var(--dsw-alias-border-l2); box-shadow: var(--dsw-elevation-prominent);
  animation: wsm-rise .2s var(--wsm-ease);
}
.wsm-savebar-msg { display: inline-flex; align-items: center; gap: 8px; min-width: 0; margin-right: 6px; color: var(--dsw-alias-label-secondary); white-space: nowrap; }
.wsm-savebar-msg::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 999px; background: var(--dsw-alias-state-warn-primary); }
.wsm-savebar-msg[data-err]::before { background: var(--dsw-alias-state-error-primary); }
.wsm-savebar-msg span { overflow: hidden; text-overflow: ellipsis; }
.wsm-panel[data-size="narrow"] .wsm-savebar { left: 12px; right: 12px; transform: none; max-width: none; }
.wsm-panel[data-size="narrow"] .wsm-savebar-msg { flex: 1; }
.wsm-saveerr { margin: -4px 0 12px; }

/* ---------- 空 / 错 / 加载 ---------- */
.wsm-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 44px 20px 32px; max-width: 420px; margin: 0 auto; }
.wsm-empty svg.wsm-ill { margin-bottom: 10px; }
.wsm-empty-title { font-size: 14px; line-height: 22px; font-weight: 500; }
.wsm-empty-body { color: var(--dsw-alias-label-tertiary); text-wrap: pretty; }
.wsm-empty .wsm-btn { margin-top: 10px; }
.wsm-empty[data-inline] { padding: 20px 8px; }
.wsm-empty[data-error] .wsm-empty-body { color: var(--dsw-alias-label-secondary); }
.wsm-errcode { margin-top: 4px; padding: 6px 10px; border-radius: 10px; background: var(--dsw-alias-bg-module-platform); font: 12px/18px var(--wsm-mono); color: var(--dsw-alias-label-secondary); }
.wsm-ill .i-bg { fill: var(--dsw-alias-illustration-background); }
.wsm-ill .i-back { fill: var(--dsw-alias-illustration-backing); }
.wsm-ill .i-surf { fill: var(--dsw-alias-bg-layer-1); stroke: var(--dsw-alias-illustration-backing); stroke-width: 1.5; }
.wsm-ill .i-inset { fill: var(--dsw-alias-illustration-inset); }
.wsm-ill .i-line { fill: none; stroke: var(--dsw-alias-illustration-detail); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.wsm-ill .i-accent { fill: none; stroke: var(--dsw-alias-label-tertiary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.wsm-skel { display: block; border-radius: 4px; background: var(--dsw-alias-bg-skeleton); animation: wsm-breathe 2s ease-in-out infinite; }
.wsm-skel-cell { height: 156px; border-radius: 16px; }
.wsm-skel-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }

/* ---------- 菜单 ---------- */
.wsm-menu {
  position: fixed; z-index: 60; min-width: 176px; max-width: min(340px, calc(100vw - 24px)); max-height: min(420px, calc(100vh - 24px)); overflow-y: auto;
  display: flex; flex-direction: column; padding: 4px; border-radius: 16px;
  background: var(--dsw-alias-bg-layer-2); --dsw-elevation-stroke-color: var(--dsw-alias-border-l2); box-shadow: var(--dsw-elevation-prominent);
  --dsh-scrollbar-thumb: var(--dsw-alias-scrollbar-bg-l2);
  animation: wsm-menu-in .1s ease-out; visibility: hidden;
}
.wsm-menu[data-placed] { visibility: visible; }
.wsm-menu-item {
  display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 8px; border: 0; border-radius: 12px; background: transparent;
  text-align: left; cursor: pointer; color: var(--dsw-alias-label-primary);
}
.wsm-menu-item:focus-visible { outline: none; background: var(--dsw-alias-interactive-bg-hover); }
@media (hover: hover) { .wsm-menu-item:hover { background: var(--dsw-alias-interactive-bg-hover); } }
.wsm-menu-item[data-danger] { color: var(--dsw-alias-state-error-primary); }
.wsm-menu-item[data-danger]:is(:hover, :focus-visible) { background: var(--dsw-alias-interactive-bg-hover-danger); }
.wsm-menu-item:disabled { opacity: .4; cursor: default; }
.wsm-menu-ic { flex: none; display: grid; place-items: center; width: 16px; color: var(--dsw-alias-menu-icon); align-self: flex-start; margin-top: 2px; }
.wsm-menu-item[data-danger] .wsm-menu-ic { color: inherit; }
.wsm-menu-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.wsm-menu-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsm-menu-desc { font-size: 11.5px; line-height: 16px; color: var(--dsw-alias-label-tertiary); text-wrap: pretty; }
.wsm-menu-check { flex: none; color: var(--dsw-alias-label-primary); align-self: center; }
.wsm-menu-sep { height: 0; margin: 3px 8px; border-top: .5px solid var(--dsw-alias-border-l2); }
.wsm-menu-group { padding: 6px 8px 2px; font-size: 11px; line-height: 15px; color: var(--dsw-alias-label-tertiary); }

/* ---------- 对话框（原生 dialog，top layer） ---------- */
.wsm-dialog {
  width: min(440px, calc(100vw - 48px)); max-height: calc(100vh - 48px); padding: 0; border: 0; border-radius: 28px;
  background: var(--dsw-alias-bg-layer-2); color: var(--dsw-alias-label-primary);
  --dsw-elevation-stroke-color: var(--dsw-alias-border-l2); box-shadow: var(--dsw-elevation-prominent);
  font-size: 14px; line-height: 22px; overflow: auto;
}
.wsm-dialog[open] { animation: wsm-dialog-in .2s var(--wsm-ease); }
.wsm-dialog::backdrop { background: var(--dsw-alias-bg-mask-1); animation: wsm-fade .2s ease; }
.wsm-dialog-head { display: flex; align-items: center; gap: 8px; padding: 22px 14px 12px 24px; }
.wsm-dialog-head .wsm-dialog-ic { color: var(--dsw-alias-state-warn-primary); }
.wsm-dialog-title { flex: 1; min-width: 0; font-size: 16px; line-height: 24px; font-weight: 500; }
.wsm-dialog-head .wsm-iconbtn { color: var(--dsw-alias-label-secondary); }
.wsm-dialog-desc { padding: 0 24px; color: var(--dsw-alias-label-secondary); text-wrap: pretty; }
.wsm-dialog-desc > * + * { margin-top: 10px; }
.wsm-dialog-desc b { color: var(--dsw-alias-label-primary); font-weight: 500; }
.wsm-dialog-path { display: block; padding: 8px 10px; border-radius: 10px; background: var(--dsw-alias-bg-module-platform); font: 12px/18px var(--wsm-mono); color: var(--dsw-alias-label-secondary); overflow-wrap: anywhere; }
.wsm-dialog-impact { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--wsm-tint-1); font-size: 13px; line-height: 20px; }
.wsm-dialog-impact[data-tone="over"] { background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 8%, transparent); color: var(--dsw-alias-state-error-primary); }
.wsm-dialog-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 22px 24px 24px; }
.wsm-dialog-foot .wsm-btn { min-width: 84px; }

/* ---------- 提示条 Toast ---------- */
.wsm-toasts { position: absolute; z-index: 50; left: 0; right: 0; bottom: 16px; display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none; transition: bottom .2s var(--wsm-ease); }
.wsm-toasts[data-lift] { bottom: 68px; }
.wsm-toast {
  pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(520px, 100%);
  padding: 10px 10px 10px 16px; border-radius: 16px; background: var(--dsw-alias-toast-bg); color: var(--dsw-alias-toast-label);
  font-size: 13px; line-height: 20px; box-shadow: var(--dsw-shadow-lv3); animation: wsm-toast-in .18s var(--wsm-ease);
}
.wsm-toast[data-leaving] { animation: wsm-toast-out .18s ease forwards; }
.wsm-toast:not([data-persistent]) { padding-right: 16px; }
.wsm-toast-text { min-width: 0; text-wrap: pretty; }
.wsm-toast-ic { flex: none; color: var(--dsw-alias-state-warn-primary); }
.wsm-toast-action { flex: none; padding: 0 4px; border: 0; background: none; color: var(--dsw-alias-toast-action); font-weight: 500; cursor: pointer; white-space: nowrap; }
.wsm-toast .wsm-iconbtn { color: color-mix(in srgb, var(--dsw-alias-toast-label) 60%, transparent); width: 24px; height: 24px; }
@media (hover: hover) { .wsm-toast .wsm-iconbtn:hover { background: color-mix(in srgb, var(--dsw-alias-toast-label) 12%, transparent); color: var(--dsw-alias-toast-label); } }

/* ---------- Tooltip（挂在 body，host Tooltip 形态） ---------- */
.wsm-tooltip {
  position: fixed; z-index: 2000; left: 0; top: 0; max-width: min(300px, calc(100vw - 24px)); padding: 4px 8px; border-radius: 8px;
  background: var(--dsw-alias-tooltip-bg); color: var(--dsw-alias-tooltip-label); font-size: 12.5px; line-height: 19px; white-space: pre-line;
  pointer-events: none; opacity: 0; transition: opacity .15s ease; font-family: var(--dsw-font-family);
}
.wsm-tooltip[data-show] { opacity: 1; }

/* ---------- 动效 ---------- */
@keyframes wsm-spin { to { transform: rotate(360deg); } }
@keyframes wsm-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes wsm-rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.wsm-panel[data-size="narrow"] .wsm-savebar { animation-name: wsm-rise-n; }
@keyframes wsm-rise-n { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes wsm-push { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes wsm-menu-in { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
@keyframes wsm-dialog-in { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes wsm-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes wsm-toast-out { to { opacity: 0; transform: translateY(4px); } }
@keyframes wsm-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
@keyframes wsm-flash { 0%, 30% { background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 8%, transparent); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) {
